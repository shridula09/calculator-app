<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fresher Calculator</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="app">
        <section class="calculator" aria-label="Calculator">
            <div class="display">
                <div id="previous-display" class="previous-display"></div>
                <div id="current-display" class="current-display">0</div>
            </div>

            <div class="buttons">
                <button class="function" data-action="clear">AC</button>
                <button class="function" data-action="backspace">⌫</button>
                <button class="function" data-action="percent">%</button>
                <button class="operator" data-value="/">÷</button>

                <button data-value="7">7</button>
                <button data-value="8">8</button>
                <button data-value="9">9</button>
                <button class="operator" data-value="*">×</button>

                <button data-value="4">4</button>
                <button data-value="5">5</button>
                <button data-value="6">6</button>
                <button class="operator" data-value="-">−</button>

                <button data-value="1">1</button>
                <button data-value="2">2</button>
                <button data-value="3">3</button>
                <button class="operator" data-value="+">+</button>

                <button class="function" data-action="sign">±</button>
                <button data-value="0">0</button>
                <button data-value=".">.</button>
                <button class="equals" data-action="equals">=</button>
            </div>
        </section>

        <aside class="history-panel">
            <div class="history-header">
                <h2>History</h2>
                <button id="clear-history">Clear</button>
            </div>
            <div id="history-list" class="history-list">
                <p class="empty-history">No calculations yet.</p>
            </div>
        </aside>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
